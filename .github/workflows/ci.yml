name: Continuous integration
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rafnexa_test
          MYSQL_USER: rafnexa
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-root-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://rafnexa:ci-only-password@127.0.0.1:3306/rafnexa_test
      DATABASE_SSL: 'false'
      PUBLIC_ORIGIN: http://127.0.0.1:4173
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run build:pages
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            playwright-pages-report/
            test-results-pages/
          retention-days: 7
