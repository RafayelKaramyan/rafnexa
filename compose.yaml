services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rafnexa
      MYSQL_USER: rafnexa
      MYSQL_PASSWORD: development-only
      MYSQL_ROOT_PASSWORD: development-root-only
    ports: ['3306:3306']
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
