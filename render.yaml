services:
  - type: web
    name: rafnexa
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/migrate.js && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: DATABASE_SSL
        value: 'true'
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
